<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Kamak Desarrollos</title>
    <script type="text/javascript">
        // Simple redirect to index.html for SPA routing
        var currentPath = window.location.pathname;
        var currentSearch = window.location.search;
        var currentHash = window.location.hash;
        
        // Redirect to index.html with the original path as a parameter
        window.location.replace('/?path=' + encodeURIComponent(currentPath + currentSearch + currentHash));
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
