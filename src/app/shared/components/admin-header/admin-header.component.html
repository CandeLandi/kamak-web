<header
  class="w-full fixed top-0 left-0 z-30 bg-black/70 backdrop-blur-md py-4 md:py-6"
>
  <div class="max-w-7xl mx-auto px-4 md:px-6 lg:px-8 flex items-center justify-between">

    <img
      src="/assets/logos/logo-kamak.svg"
      width="140"
      height="40"
      alt="Kamak"
    />
    <div class="flex flex-row items-center gap-2 md:gap-4 sm:gap-6">
      <a href="/" target="_blank" class="w-auto">
                 <button
           class="text-white border border-white/20 hover:bg-white/10 px-3 py-2 rounded-md transition-all duration-200 text-sm font-medium hover:border-white/40"
         >
          Ver sitio
        </button>
      </a>
      <button
        type="button"
        (click)="logout.emit()"
        title="Cerrar sesión"
                 class="text-white border border-white/20 hover:bg-white/10 px-3 py-2 rounded-md flex items-center transition-all duration-200 text-sm font-medium gap-2 hover:border-white/40"
      >
        <svg
          class="h-4 w-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v1"
          />
        </svg>
        <span class="hidden sm:inline">Cerrar sesión</span>
      </button>
    </div>
  </div>
</header>
