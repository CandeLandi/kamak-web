<header class="site-header" [class.site-header--scrolled]="scrolled" data-testid="site-header">
  <div class="site-header__inner">
    <a routerLink="/" class="site-header__logo" aria-label="Kamak Desarrollos">
      <img src="assets/logos/logo-kamak.svg" alt="Kamak Desarrollos" width="154" height="42" />
    </a>

    <nav class="site-header__nav" aria-label="Navegación principal">
      @for (item of navItems; track item.label) {
        <a [href]="item.href">{{ item.label }}</a>
      }
    </nav>

    <div class="site-header__actions">
      <a
        href="https://wa.me/5492262559474?text=Hola%2C%20quiero%20solicitar%20una%20propuesta%20para%20un%20proyecto%20comercial"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-primary site-header__cta"
        data-testid="header-proposal-link"
      >
        Solicitar propuesta
      </a>
      <button
        type="button"
        class="site-header__menu"
        (click)="toggleMobileMenu()"
        aria-label="Abrir menú"
        data-testid="header-menu-button"
      >
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>

@if (mobileMenuOpen) {
  <div class="mobile-menu" data-testid="mobile-menu">
    <div class="mobile-menu__top">
      <img src="assets/logos/logo-kamak.svg" alt="Kamak Desarrollos" width="132" height="36" />
      <button type="button" (click)="toggleMobileMenu()" aria-label="Cerrar menú" data-testid="mobile-menu-close">Cerrar</button>
    </div>
    <nav>
      @for (item of navItems; track item.label) {
        <a [href]="item.href" (click)="toggleMobileMenu()">{{ item.label }}</a>
      }
    </nav>
    <a
      href="https://wa.me/5492262559474?text=Hola%2C%20quiero%20solicitar%20una%20propuesta%20para%20un%20proyecto%20comercial"
      target="_blank"
      rel="noopener noreferrer"
      class="btn btn-primary"
      data-testid="mobile-menu-proposal-link"
    >
      Solicitar propuesta
    </a>
  </div>
}
