<section id="equipo" class="kamak-section-dark section-pad team-section">
  <div class="kamak-container">
    <div class="section-heading section-heading--split">
      <div>
        <span class="eyebrow">CAPACIDAD OPERATIVA</span>
        <h2>Equipo técnico permanente</h2>
      </div>
      <p>
        Un equipo preparado para <strong>coordinar, supervisar y resolver</strong> cada etapa del proyecto con
        criterio técnico y visión operativa.
      </p>
    </div>

    <div class="team-stack">
      @for (member of teamMembers; track member.id) {
        <article class="team-band" [class.team-band--reverse]="member.imageOrder === 'right'">
          <div class="team-band__image">
            <img [src]="member.image" [alt]="member.title" loading="lazy" decoding="async" />
          </div>
          <div class="team-band__content">
            <h3>{{ member.title }}</h3>
            <p [innerHTML]="member.description"></p>
            <div class="tag-row">
              @for (tag of member.tags; track tag) {
                <span>{{ tag }}</span>
              }
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
